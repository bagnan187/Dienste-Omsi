<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#dce7d4"/>
<text x="40" y="42" font-family="Arial" font-size="28" font-weight="700">ROGIS Hof Hechem – Stellplatz-Lageplan</text>
<text x="40" y="67" font-family="Arial" font-size="14">7 Bestandsplätze werden genutzt · 5 neue Plätze nur auf einer ausdrücklich neu befestigten Nordfläche</text>
<rect x="175" y="300" width="555" height="235" rx="8" fill="#d1d5db" stroke="#4b5563" stroke-width="3"/>
<text x="190" y="325" font-family="Arial" font-size="13" font-weight="700">BESTANDS-ASPHALT</text>
<rect x="175" y="125" width="555" height="155" rx="8" fill="#e5e7eb" stroke="#b45309" stroke-width="4" stroke-dasharray="10 7"/>
<text x="452" y="145" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">NEUE BEFESTIGTE ERWEITERUNG</text>
<text x="452" y="163" text-anchor="middle" font-family="Arial" font-size="11">heutige Grün-/Randfläche erst asphaltieren, entwässern und einfassen – dann H008–H012 setzen</text>
<rect x="330" y="320" width="250" height="210" fill="#cbd5e1" stroke="#64748b" stroke-dasharray="8 6" stroke-width="2"/>
<text x="455" y="420" text-anchor="middle" font-family="Arial" font-size="13">zentrale Rangierfläche</text><text x="455" y="438" text-anchor="middle" font-family="Arial" font-size="13">bleibt frei</text>
<rect x="625" y="325" width="75" height="75" fill="#b7b7b7" stroke="#374151" stroke-width="2"/><text x="662" y="365" text-anchor="middle" font-family="Arial" font-size="11">Unterstand</text>
<g transform="rotate(-30 246 417.5)"><rect x="225" y="365" width="42" height="105" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="246" y="420.5" text-anchor="middle" font-size="10" font-family="Arial">H001</text></g><g transform="rotate(-30 328 417.5)"><rect x="307" y="365" width="42" height="105" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="328" y="420.5" text-anchor="middle" font-size="10" font-family="Arial">H002</text></g><g transform="rotate(-30 410 417.5)"><rect x="389" y="365" width="42" height="105" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="410" y="420.5" text-anchor="middle" font-size="10" font-family="Arial">H003</text></g><g transform="rotate(0 488 430)"><rect x="465" y="380" width="46" height="100" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="488" y="433" text-anchor="middle" font-size="10" font-family="Arial">H004</text></g><g transform="rotate(0 546 430)"><rect x="523" y="380" width="46" height="100" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="546" y="433" text-anchor="middle" font-size="10" font-family="Arial">H005</text></g><g transform="rotate(0 604 430)"><rect x="581" y="380" width="46" height="100" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="604" y="433" text-anchor="middle" font-size="10" font-family="Arial">H006</text></g><g transform="rotate(0 662 430)"><rect x="639" y="380" width="46" height="100" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="662" y="433" text-anchor="middle" font-size="10" font-family="Arial">H007</text></g><g transform="rotate(0 281 210)"><rect x="255" y="155" width="52" height="110" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="281" y="213" text-anchor="middle" font-size="10" font-family="Arial">H008</text></g><g transform="rotate(0 369 210)"><rect x="343" y="155" width="52" height="110" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="369" y="213" text-anchor="middle" font-size="10" font-family="Arial">H009</text></g><g transform="rotate(0 457 210)"><rect x="431" y="155" width="52" height="110" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="457" y="213" text-anchor="middle" font-size="10" font-family="Arial">H010</text></g><g transform="rotate(0 545 210)"><rect x="519" y="155" width="52" height="110" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="545" y="213" text-anchor="middle" font-size="10" font-family="Arial">H011</text></g><g transform="rotate(0 633 210)"><rect x="607" y="155" width="52" height="110" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="633" y="213" text-anchor="middle" font-size="10" font-family="Arial">H012</text></g>
<path d="M175,500 L90,500 L90,560 L250,560 L250,535" fill="#9ca3af" stroke="#4b5563" stroke-width="3"/>
<text x="110" y="532" font-family="Arial" font-size="12" font-weight="700">Zufahrt frei</text>
<rect x="40" y="82" width="18" height="18" fill="#d1d5db" stroke="#4b5563"/><text x="65" y="96" font-family="Arial" font-size="12">Bestandsbefestigung</text>
<rect x="270" y="82" width="18" height="18" fill="#e5e7eb" stroke="#b45309"/><text x="295" y="96" font-family="Arial" font-size="12">neu zu befestigende Fläche</text>
<text x="40" y="588" font-family="Arial" font-size="11">H001–H007 folgen dem bestehenden Hof. H008–H012 werden erst nach dem Ausbau der Nordkante gesetzt; niemals direkt ins Gras.</text>
