<text x="42" y="735" font-family="Arial" font-size="11">Wichtig: M177–M350 sind erst nach baulichem Ausbau der Nordfläche zu setzen. Mitarbeiterparkplätze, Werkstatt, Waschen/Tanken/Laden und sämtliche Fahrgassen bleiben frei.</text>
